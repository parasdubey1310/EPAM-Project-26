<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Bank Customer Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
            cursor: pointer;
        }

        h2 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 10px;
            color: #444;
        }

        ol {
            margin-left: 20px;
            margin-bottom: 20px;
        }

        li {
            margin-bottom: 8px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: gray;
            font-size: 13px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1 id="hoverText">🏦 XYZ Bank</h1>

    <h2>Customer Coupon Portal</h2>

    <p id="instructions">
        Follow these steps to generate your Diwali Coupon:
    </p>

    <ol id="steps">
        <li>Click Register</li>
        <li>Enter your Customer ID</li>
        <li>Validate Customer</li>
        <li>Generate Coupon</li>
    </ol>

    <button id="registerBtn">
        Register
    </button>

    <br><br>

    <label for="custID">Customer ID</label>

    <input
        type="text"
        id="custID"
        placeholder="Example: XYZ12345">

    <div class="btn-group">

        <button onclick="validateCustomer()">
            Validate Customer
        </button>

        <button onclick="generateCoupon()">
            Generate Coupon
        </button>

    </div>

    <h3 id="message"></h3>

    <div class="footer">
        EPAM Week-1 Assignment - PARAS DUBEY | JavaScript Case Study
    </div>

</div>

<script src="script.js"></script>

</body>

</html>
